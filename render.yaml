services:
  # Frontend (Expo app exportado para web)
  - type: web
    name: clyvo-vet-web
    env: static
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
